name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (for example v0.0.1)'
        required: true
        default: 'v0.0.1'
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '6.0.x'
  PROJECT: 'src/Halaqa.Desktop/Halaqa.Desktop.csproj'
  RUNTIME: 'win-x64'

jobs:
  validate-and-release:
    name: Test and publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore locked dependencies
        run: dotnet restore halaqa.sln --locked-mode --runtime ${{ env.RUNTIME }}

      - name: Build
        run: dotnet build halaqa.sln --configuration Release --no-restore --nologo

      - name: Run tests
        run: dotnet test halaqa.sln --configuration Release --no-build --nologo --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Validate API secret
        shell: pwsh
        env:
          HALAQA_API_ADDRESS: ${{ secrets.HALAQA_API_BASE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HALAQA_API_ADDRESS)) {
            throw 'Repository secret HALAQA_API_BASE_URL is required before creating a release.'
          }
          $uri = [Uri]$env:HALAQA_API_ADDRESS
          if ($uri.Scheme -ne 'https' -or [string]::IsNullOrWhiteSpace($uri.Host)) {
            throw 'HALAQA_API_BASE_URL must be an absolute HTTPS URL.'
          }

      - name: Publish self-contained single-file application
        shell: pwsh
        env:
          HALAQA_API_ADDRESS: ${{ secrets.HALAQA_API_BASE_URL }}
        run: |
          dotnet publish $env:PROJECT `
            --configuration Release `
            --runtime $env:RUNTIME `
            --self-contained true `
            --output publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            --no-restore `
            --nologo

          $settingsPath = Join-Path $PWD 'publish/appsettings.json'
          $settings = Get-Content $settingsPath -Raw | ConvertFrom-Json
          $settings.Api.BaseUrl = $env:HALAQA_API_ADDRESS
          $settings | ConvertTo-Json -Depth 10 | Set-Content $settingsPath -Encoding utf8

          if (-not (Test-Path 'publish/Halaqa.Desktop.exe')) {
            throw 'The expected self-contained executable was not produced.'
          }

      - name: Package and checksum
        id: package
        shell: pwsh
        run: |
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '${{ inputs.tag }}' }
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = 'v0.0.1' }
          Compress-Archive -Path 'publish/*' -DestinationPath "Halaqa.Desktop-$tag-win-x64.zip" -Force
          (Get-FileHash "Halaqa.Desktop-$tag-win-x64.zip" -Algorithm SHA256).Hash + "  Halaqa.Desktop-$tag-win-x64.zip" | Set-Content "Halaqa.Desktop-$tag-win-x64.zip.sha256"
          "TAG=$tag" | Out-File $env:GITHUB_ENV -Append
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Halaqa-${{ steps.package.outputs.tag }}-win-x64
          path: |
            Halaqa.Desktop-${{ steps.package.outputs.tag }}-win-x64.zip
            Halaqa.Desktop-${{ steps.package.outputs.tag }}-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: Halaqa ${{ steps.package.outputs.tag }}
          generate_release_notes: true
          files: |
            Halaqa.Desktop-${{ steps.package.outputs.tag }}-win-x64.zip
            Halaqa.Desktop-${{ steps.package.outputs.tag }}-win-x64.zip.sha256
          fail_on_unmatched_files: true
